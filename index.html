<!DOCTYPE html>
<html>
<head>
<title>Moving Car</title>

<style>
.car {
    font-size: 60px;
    position: relative;

    animation: move 4s linear infinite;
}

@keyframes move {

    from {
        left: 0;
    }

    to {
        left: 500px;
    }
}
</style>
</head>

<body>

<div class="car">🚗</div>

</body>
</html>
